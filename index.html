<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robot Eyes Remote</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
      padding: 24px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .status {
      margin-bottom: 10px;
      color: #7dff7d;
      font-size: 16px;
      min-height: 24px;
    }

    .substatus {
      margin-bottom: 20px;
      color: #aaa;
      font-size: 13px;
      min-height: 18px;
    }

    .screen-wrap {
      margin: 0 auto 16px auto;
      max-width: 384px;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 128 / 64;
      background: #000;
      border: 2px solid #333;
      border-radius: 10px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
      cursor: crosshair;
    }

    .row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 384px;
      margin: 0 auto 18px auto;
    }

    .buttons {
      display: grid;
      gap: 14px;
      max-width: 360px;
      margin: 0 auto;
    }

    button {
      padding: 16px;
      font-size: 18px;
      border: 0;
      border-radius: 14px;
      background: #222;
      color: #fff;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
      background: #333;
    }

    .small {
      padding: 12px 16px;
      font-size: 16px;
      border-radius: 12px;
    }

    .send {
      background: #1f6feb;
    }

    .clear {
      background: #444;
    }

    .laughter { background: #2a7d2a; }
    .anger { background: #a32323; }
    .sadness { background: #2456a8; }
    .surprise { background: #b58900; }

    .reconnect {
      margin-top: 18px;
      padding: 12px 18px;
      font-size: 16px;
      border-radius: 12px;
      background: #333;
    }

    .hint {
      margin-top: 24px;
      font-size: 13px;
      color: #888;
    }

    .section-title {
      margin: 18px 0 10px 0;
      color: #ddd;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <h1>Robot Eyes</h1>

  <div class="status" id="status">Connecting...</div>
  <div class="substatus" id="substatus">Broker: EMQX</div>

  <div class="section-title">Экран 128x64</div>

  <div class="screen-wrap">
    <canvas id="screen" width="128" height="64"></canvas>
  </div>

  <div class="row">
    <button class="small clear" onclick="clearCanvas()">Очистить</button>
    <button class="small send" onclick="sendDrawing()">Отправить рисунок</button>
  </div>

  <div class="section-title">Эмоции</div>

  <div class="buttons">
    <button class="laughter" onclick="sendEmotion('laughter')">Смех</button>
    <button class="anger" onclick="sendEmotion('anger')">Злость</button>
    <button class="sadness" onclick="sendEmotion('sadness')">Грусть</button>
    <button class="surprise" onclick="sendEmotion('surprise')">Удивление</button>
  </div>

  <button class="reconnect" onclick="manualReconnect()">Переподключить</button>

  <div class="hint">
    Рисуй белым по чёрному. После отправки рисунок будет показан на OLED 60 секунд.
  </div>

  <script src="https://cdn.jsdelivr.net/npm/mqtt/dist/mqtt.min.js"></script>

  <script>
    // ВАЖНО: SECRET должен совпадать с SECRET в main.py на ESP32.
    const SECRET = "r3b0t-3y3s-7f2a91c4d8e6b0a35c7d9e1f2a4b6c8d";

    // Должно совпадать с ESP32.
    // ESP32: broker.emqx.io:1883
    // Сайт:  wss://broker.emqx.io:8084/mqtt
    const BROKER_NAME = "EMQX";
    const BROKER_URL = "wss://broker.emqx.io:8084/mqtt";

    const CMD_TOPIC = "robot-eyes/" + SECRET + "/cmd";
    const IMAGE_TOPIC = "robot-eyes/" + SECRET + "/image";
    const STATUS_TOPIC = "robot-eyes/" + SECRET + "/status";

    const statusEl = document.getElementById("status");
    const substatusEl = document.getElementById("substatus");
    const canvas = document.getElementById("screen");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });

    let client = null;
    let brokerConnected = false;
    let lastEspSeen = 0;
    let espOnline = false;

    let drawing = false;
    let lastX = 0;
    let lastY = 0;

    function setStatus(text, color) {
      statusEl.textContent = text;
      statusEl.style.color = color;
    }

    function setSubstatus(text) {
      substatusEl.textContent = text;
    }

    function updateStatus() {
      if (!brokerConnected) {
        setStatus("Connecting...", "#ffcf5d");
        setSubstatus("Broker: " + BROKER_NAME);
        return;
      }

      const now = Date.now();
      const espAge = now - lastEspSeen;

      if (lastEspSeen === 0) {
        setStatus("Broker connected, waiting ESP...", "#ffcf5d");
        setSubstatus("ESP heartbeat not received yet");
        espOnline = false;
        return;
      }

      if (espAge > 20000) {
        setStatus("ESP offline", "#ff7d7d");
        setSubstatus("Last ESP heartbeat: " + Math.round(espAge / 1000) + " sec ago");
        espOnline = false;
      } else {
        setStatus("Connected, ESP online", "#7dff7d");
        setSubstatus("Last ESP heartbeat: " + Math.round(espAge / 1000) + " sec ago");
        espOnline = true;
      }
    }

    function connectMQTT() {
      if (client) {
        try {
          client.end(true);
        } catch (e) {
          console.warn("client.end error", e);
        }
      }

      brokerConnected = false;
      updateStatus();

      client = mqtt.connect(BROKER_URL, {
        clientId: "web-robot-eyes-" + Math.random().toString(16).slice(2),
        clean: true,
        keepalive: 30,
        reconnectPeriod: 2000,
        connectTimeout: 5000,
        protocolVersion: 4
      });

      client.on("connect", () => {
        console.log("MQTT connected to " + BROKER_NAME);
        brokerConnected = true;

        client.subscribe(STATUS_TOPIC, { qos: 0 }, (err) => {
          if (err) {
            console.error("Subscribe status error:", err);
          }
        });

        updateStatus();
      });

      client.on("reconnect", () => {
        console.log("MQTT reconnecting...");
        brokerConnected = false;
        setStatus("Reconnecting...", "#ffcf5d");
        updateStatus();
      });

      client.on("close", () => {
        console.log("MQTT closed");
        brokerConnected = false;
        updateStatus();
      });

      client.on("offline", () => {
        console.log("MQTT offline");
        brokerConnected = false;
        updateStatus();
      });

      client.on("error", (err) => {
        console.error("MQTT error:", err);
        setStatus("Broker error", "#ff7d7d");
        setSubstatus(String(err.message || err));
      });

      client.on("message", (topic, message) => {
        if (topic === STATUS_TOPIC) {
          lastEspSeen = Date.now();
          updateStatus();
        }
      });
    }

    function manualReconnect() {
      lastEspSeen = 0;
      espOnline = false;
      setStatus("Manual reconnect...", "#ffcf5d");
      connectMQTT();
    }

    function clearCanvas() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.imageSmoothingEnabled = false;

      setSubstatus("Canvas cleared");
    }

    function getCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (canvas.width / rect.width),
        y: (e.clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    canvas.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      drawing = true;

      try {
        canvas.setPointerCapture(e.pointerId);
      } catch (_) {}

      const p = getCanvasPos(e);
      lastX = p.x;
      lastY = p.y;

      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1, 0, Math.PI * 2);
      ctx.fill();
    }, { passive: false });

    canvas.addEventListener("pointermove", (e) => {
      if (!drawing) return;
      e.preventDefault();

      const p = getCanvasPos(e);

      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();

      lastX = p.x;
      lastY = p.y;
    }, { passive: false });

    canvas.addEventListener("pointerup", (e) => {
      drawing = false;
    });

    canvas.addEventListener("pointercancel", () => {
      drawing = false;
    });

    canvas.addEventListener("contextmenu", (e) => {
      e.preventDefault();
    });

    function canvasToBase64() {
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const d = imageData.data;

      // 128x64 монохромно = 1024 байта
      const bytes = new Uint8Array(1024);

      for (let y = 0; y < 64; y++) {
        const page = y >> 3;
        const bit = 1 << (y & 7);
        const rowOffset = y * 128;
        const bufferOffset = page * 128;

        for (let x = 0; x < 128; x++) {
          const idx = (rowOffset + x) * 4;

          // Белый пиксель => 1 на OLED
          if (d[idx] > 127 || d[idx + 1] > 127 || d[idx + 2] > 127) {
            bytes[bufferOffset + x] |= bit;
          }
        }
      }

      let binary = "";
      for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
      }

      return btoa(binary);
    }

    function sendDrawing() {
      if (!client || !client.connected) {
        setStatus("Not connected", "#ff7d7d");
        connectMQTT();
        return;
      }

      try {
        const payload = canvasToBase64();

        client.publish(IMAGE_TOPIC, payload, { qos: 0 }, (err) => {
          if (err) {
            console.error("Publish image error:", err);
            setStatus("Send error", "#ff7d7d");
            setSubstatus(String(err.message || err));
          } else {
            setStatus("Drawing sent", "#7dff7d");

            if (!espOnline) {
              setSubstatus("Drawing sent, but ESP looks offline");
            } else {
              setSubstatus("Robot will show drawing for 60 sec");
            }
          }
        });
      } catch (e) {
        console.error(e);
        setStatus("Canvas error", "#ff7d7d");
        setSubstatus(String(e.message || e));
      }
    }

    function sendEmotion(emotion) {
      if (!client || !client.connected) {
        setStatus("Not connected", "#ff7d7d");
        connectMQTT();
        return;
      }

      client.publish(CMD_TOPIC, emotion, { qos: 0 }, (err) => {
        if (err) {
          console.error("Publish error:", err);
          setStatus("Send error", "#ff7d7d");
          setSubstatus(String(err.message || err));
        } else {
          setStatus("Sent: " + emotion, "#7dff7d");

          if (!espOnline) {
            setSubstatus("Message sent, but ESP looks offline");
          } else {
            setSubstatus("Message sent to " + BROKER_NAME);
          }
        }
      });
    }

    window.sendEmotion = sendEmotion;
    window.sendDrawing = sendDrawing;
    window.clearCanvas = clearCanvas;
    window.manualReconnect = manualReconnect;

    setInterval(updateStatus, 1000);

    clearCanvas();
    connectMQTT();
  </script>

</body>
</html>
